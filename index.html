<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OpenCanvas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        touch-action: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1c1c1e;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      /* gallery view container */
      #gallery-root {
        position: absolute;
        inset: 0;
        z-index: 10;
      }
      #gallery-root.hidden {
        display: none;
      }
      /* canvas view container */
      #canvas-container {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #canvas-container.hidden {
        display: none;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
      }
      #ui-root > * {
        pointer-events: auto;
      }
      .webgl-error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        text-align: center;
        font-family: system-ui, sans-serif;
        padding: 2rem;
        background: rgba(0,0,0,0.8);
        border-radius: 12px;
      }
      .webgl-error h1 {
        color: #ff6b6b;
        margin-bottom: 1rem;
      }
      /* custom scrollbar for gallery */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #3a3a3c;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a4a4c;
      }
      /* slider styling */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
      }
      input[type="range"]::-webkit-slider-track {
        height: 4px;
        background: #3a3a3c;
        border-radius: 2px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        margin-top: -7px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
      input[type="range"]::-moz-range-track {
        height: 4px;
        background: #3a3a3c;
        border-radius: 2px;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="gallery-root"></div>
      <div id="canvas-container" class="hidden">
        <canvas id="canvas"></canvas>
        <div id="ui-root"></div>
      </div>
      <noscript>
        <div class="webgl-error">
          <h1>JavaScript Required</h1>
          <p>Please enable JavaScript to use OpenCanvas.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
