<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>OpenCanvas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        touch-action: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a1a;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #ui-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #ui-root > * {
        pointer-events: auto;
      }
      .webgl-error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        text-align: center;
        font-family: system-ui, sans-serif;
        padding: 2rem;
        background: rgba(0,0,0,0.8);
        border-radius: 8px;
      }
      .webgl-error h1 {
        color: #ff6b6b;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
      <div id="ui-root"></div>
      <noscript>
        <div class="webgl-error">
          <h1>JavaScript Required</h1>
          <p>Please enable JavaScript to use OpenCanvas.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
